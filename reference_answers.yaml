#  - Para aprobar una necesidad: reescribir `respuesta_referencia` con palabras propias
#    del equipo, llenar `autor` y `fecha_revision` (AAAA-MM-DD) y poner `aprobado: true`.
#  - Las cifras corresponden al periodo completo con ventas (ene 2016 – mar 2018) y a
#    todas las tiendas. Si se genera el PDF con filtros, las tablas y gráficas cambian,
